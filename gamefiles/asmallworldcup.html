<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Small World Cup</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: #000;
        }
        .toolbar {
            display: flex;
            gap: .5rem;
            padding: .5rem 1rem;
            background: #111;
            color: #fff;
            align-items: center;
            height: 48px;
            box-sizing: border-box;
        }
        button {
            background: #0b84ff;
            color: #fff;
            border: 0;
            padding: .45rem .9rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:active {
            transform: translateY(1px);
        }
        .frame-wrapper {
            height: calc(100% - 48px);
            background: #000;
            position: relative;
        }
        iframe {
            border: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span style="font-weight:600">A Small World Cup</span>
        <button id="homeBtn">Home</button>
        <div style="flex:1"></div>
        <button id="fsBtn">Enter fullscreen</button>
    </div>

    <div class="frame-wrapper" id="frameWrapper">
        <!-- Direct, working game file (no ads, no extra site UI) -->
        <iframe id="gameFrame"
                src="https://unblocked-games.s3.amazonaws.com/a-small-world-cup.html"
                allowfullscreen
                allow="fullscreen; autoplay; gamepad"
                title="A Small World Cup">
        </iframe>
    </div>

    <script>
        const fsBtn   = document.getElementById('fsBtn');
        const wrapper = document.getElementById('frameWrapper');
        const homeBtn = document.getElementById('homeBtn');

        function isFullscreen() {
            return !!(document.fullscreenElement ||
                      document.webkitFullscreenElement ||
                      document.mozFullScreenElement ||
                      document.msFullscreenElement);
        }

        function requestFull(el) {
            return el.requestFullscreen?.() ||
                   el.webkitRequestFullscreen?.() ||
                   el.mozRequestFullScreen?.() ||
                   el.msRequestFullscreen?.();
        }

        function exitFull() {
            return document.exitFullscreen?.() ||
                   document.webkitExitFullscreen?.() ||
                   document.mozCancelFullScreen?.() ||
                   document.msExitFullscreen?.();
        }

        fsBtn.addEventListener('click', async () => {
            try {
                if (!isFullscreen()) {
                    await requestFull(wrapper);
                    fsBtn.textContent = 'Exit fullscreen';
                } else {
                    await exitFull();
                    fsBtn.textContent = 'Enter fullscreen';
                }
            } catch (err) {
                console.error('Fullscreen failed:', err);
            }
        });

        // Keep button text correct if user presses Esc
        ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
            .forEach(e => document.addEventListener(e, () => {
                fsBtn.textContent = isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen';
            }));

        homeBtn.addEventListener('click', () => {
            // Change this if your real home page is different
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
