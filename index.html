<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chicken Kings Vault</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <style>
    :root {
      --bg: #07070a;
      --surface: #111116;
      --surface-2: #18181f;
      --surface-3: #1e1e27;
      --border: rgba(255,255,255,0.08);
      --text: #f4efe9;
      --muted: #9aa0b3;
      --gold: #e8b84b;
      --gold-2: #f5d77a;
      --accent: #7c5cbf;
      --danger: #c8503a;
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #17181f 0%, #07070a 58%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    button, input {
      font: inherit;
    }

    .page-shell {
      position: relative;
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
    }

    .ambient {
      position: fixed;
      inset: auto;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    .ambient.one {
      width: 500px; height: 500px; background: #e8b84b; top: -150px; left: -100px;
      animation: drift1 18s ease-in-out infinite;
    }

    .ambient.two {
      width: 420px; height: 420px; background: #7c5cbf; bottom: -140px; right: -80px;
      animation: drift2 20s ease-in-out infinite;
    }

    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.08); }
    }

    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-50px, -40px) scale(1.12); }
    }

    #main-site {
      position: relative;
      z-index: 1;
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0 22px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .logo:hover { transform: translateY(-1px); }

    .logo-icon-wrap {
      position: relative;
      width: 44px; height: 44px;
    }

    .logo-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff3d0, #e8b84b 18%, #7c5cbf 60%, #24183c 100%);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 0 30px rgba(232,184,75,0.25);
    }

    .logo-halo {
      position: absolute; inset: -6px; border-radius: 50%;
      background: rgba(232,184,75,0.12); filter: blur(12px);
      z-index: -1;
    }

    .logo-text {
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1;
      font-size: 1.6rem;
    }

    .logo-text span { color: var(--gold); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: 0.2s ease;
      font-weight: 600;
    }

    .btn:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.14);
    }

    .btn-primary {
      background: linear-gradient(180deg, #e8b84b, #c08a2c);
      border-color: rgba(255,255,255,0.13);
      color: #0e0d14;
      font-weight: 800;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 8px 0 18px;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 220px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .search-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      min-width: 0;
    }

    .search-wrap input::placeholder { color: var(--muted); }

    .search-clear {
      display: none;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: rgba(17,17,22,0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 18px;
      margin-bottom: 22px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 12px rgba(232,184,75,0.9);
    }

    .status-value { color: var(--text); font-weight: 700; }

    #game-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .game-link {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(17,17,22,0.8);
      color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      min-height: 220px;
    }

    .game-link:hover {
      transform: translateY(-4px);
      border-color: rgba(232,184,75,0.5);
      box-shadow: 0 18px 28px rgba(0,0,0,0.2);
    }

    .game-link img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
    }

    .game-link div {
      padding: 12px 12px 14px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
    }

    #no-results {
      display: none;
      padding: 40px 16px 0;
      text-align: center;
      color: var(--muted);
      font-size: 1.1rem;
    }

    #start-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #e8f1ff 0%, #dbeafe 32%, #d7e3ff 60%, #e5ddff 100%);
      z-index: 9999;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .join-card {
      width: min(460px, calc(100vw - 28px));
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 24px 60px rgba(30,41,59,0.15);
      padding: 36px 30px 26px;
      text-align: center;
      color: #1e293b;
    }

    .brand {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -0.06em;
      margin-bottom: 8px;
      color: #2563eb;
    }

    .brand span { color: #1d4ed8; }

    .subtitle {
      color: #64748b;
      font-weight: 700;
      margin-bottom: 26px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 800;
      margin: 0 0 10px;
      color: #334155;
    }

    .join-input {
      width: 100%;
      border-radius: 13px;
      border: 2px solid #dbe3ef;
      background: #f8fafc;
      padding: 16px 18px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #1e293b;
      text-align: center;
      outline: none;
      margin-bottom: 14px;
    }

    .join-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59,130,246,0.13);
    }

    .join-btn {
      width: 100%;
      border: none;
      border-radius: 13px;
      background: linear-gradient(180deg, #60a5fa 0%, #3b82f6 45%, #2563eb 100%);
      color: white;
      padding: 15px 18px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #1d4ed8;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .join-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 0 #1d4ed8;
    }

    .join-error {
      min-height: 18px;
      margin-top: 12px;
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .join-error.show { opacity: 1; }

    @media (max-width: 640px) {
      header { align-items: flex-start; }
      .top-bar { flex-direction: column; align-items: stretch; }
      .search-wrap { width: 100%; }
      #game-list { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="ambient one"></div>
    <div class="ambient two"></div>

    <div id="start-screen">
      <div class="join-card">
        <div class="brand">Blooker<span>et</span></div>
        <div class="subtitle">Enter a game ID to join</div>

        <label for="game-id-input">Game thingy</label>
        <input id="game-id-input" class="join-input" type="text" maxlength="8" inputmode="numeric" placeholder="Enter Game ID" autocomplete="off" />
        <button id="join-btn" class="join-btn" type="button">Join</button>
        <div id="join-error" class="join-error" aria-live="polite"></div>
      </div>
    </div>

    <div id="main-site">
      <header>
        <div class="logo" data-home="true" aria-label="Go home">
          <div class="logo-icon-wrap">
            <div class="logo-halo"></div>
            <div class="logo-icon"></div>
          </div>
          <div class="logo-text">Chicken <span>King</span>s Vault</div>
        </div>

        <div class="header-actions">
          <button class="btn btn-primary" type="button" data-home="true">Home</button>
          <button class="btn" type="button" id="spinny-btn">Spin</button>
        </div>
      </header>

      <div class="top-bar">
        <div class="search-wrap">
          <input id="search-input" type="search" placeholder="Search games..." aria-label="Search games" />
          <button id="search-clear" class="search-clear" type="button" aria-label="Clear search">Clear</button>
        </div>

        <button id="random-btn" class="btn" type="button">Random</button>
      </div>

      <div class="stats-bar">
        <div class="status-left">
          <span class="dot"></span>
          <span>Games</span>
          <span class="status-value" id="stats-total">0</span>
        </div>
        <div class="status-left">
          <span>Mode</span>
          <span class="status-value" id="stats-cloak">On</span>
        </div>
        <div class="status-left">
          <span>Version</span>
          <span class="status-value" id="stats-version">2.1</span>
        </div>
      </div>

      <div id="game-list"></div>
      <div id="no-results">No games match your search.</div>
    </div>
  </div>

  <script src="games.js"></script>
  <script>
    (function () {
      const startScreen = document.getElementById('start-screen');
      const mainSite = document.getElementById('main-site');
      const joinBtn = document.getElementById('join-btn');
      const joinInput = document.getElementById('game-id-input');
      const errorBox = document.getElementById('join-error');
      const homeButtons = document.querySelectorAll('[data-home="true"]');

      function showHome() {
        if (startScreen) startScreen.classList.add('hidden');
        if (mainSite) mainSite.style.display = 'block';
        if (window.scrollTo) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        if (window.history && window.location) {
          history.replaceState(null, '', '#home');
        }
      }

      function hideGate() {
        localStorage.setItem('bennett-joined', 'true');
        showHome();
      }

      function setError(message) {
        errorBox.textContent = message;
        errorBox.classList.add('show');
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.classList.remove('show');
      }

      function attemptJoin() {
        const code = (joinInput.value || '').trim();
        if (!code) {
          setError('Please enter a Game ID');
          return;
        }

        if (code === '6644') {
          clearError();
          hideGate();
          return;
        }

        setError('Invalid Game ID');
      }

      if (localStorage.getItem('bennett-joined') === 'true') {
        hideGate();
      }

      joinBtn.addEventListener('click', attemptJoin);
      joinInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          attemptJoin();
        }
      });

      homeButtons.forEach(function (button) {
        button.addEventListener('click', function (event) {
          event.preventDefault();
          showHome();
        });
      });

      window.attemptJoin = attemptJoin;
      window.spinnywheel = showHome;
      window.showHome = showHome;
      window.addEventListener('load', function () {
        if (localStorage.getItem('bennett-joined') === 'true') {
          showHome();
        }
      });
    })();
  </script>
</body>
</html>
