<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A Small World Cup</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        }
        .toolbar {
            display: flex;
            gap: .5rem;
            padding: .5rem;
            background: #111;
            color: #fff;
            align-items: center;
        }
        button {
            background: #0b84ff;
            color: #fff;
            border: 0;
            padding: .5rem .8rem;
            border-radius: 4px;
            cursor: pointer;
        }
        button:active {
            transform: translateY(1px);
        }
        .frame-wrapper {
            height: calc(100% - 48px);
            background: #000;
            display: flex;
        }
        iframe {
            border: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span>A Small World Cup</span>
        <button id="homeBtn">Home</button>
        <div style="flex:1"></div>
        <button id="fsBtn">Enter fullscreen</button>
    </div>

    <div class="frame-wrapper" id="frameWrapper">
        <!-- Working online version of the game -->
        <iframe id="gameFrame"
                src="https://sciencemathedu.github.io/asmallworldcup/"
                allowfullscreen
                allow="fullscreen"
                title="A Small World Cup">
        </iframe>
    </div>

    <script>
        const fsBtn = document.getElementById('fsBtn');
        const wrapper = document.getElementById('frameWrapper');
        const homeBtn = document.getElementById('homeBtn');

        function isFullscreen() {
            return !!(document.fullscreenElement ||
                      document.webkitFullscreenElement ||
                      document.mozFullScreenElement ||
                      document.msFullscreenElement);
        }

        function requestFull(element) {
            if (element.requestFullscreen) return element.requestFullscreen();
            if (element.webkitRequestFullscreen) return element.webkitRequestFullscreen();
            if (element.mozRequestFullScreen) return element.mozRequestFullScreen();
            if (element.msRequestFullscreen) return element.msRequestFullscreen();
        }

        function exitFull() {
            if (document.exitFullscreen) return document.exitFullscreen();
            if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
            if (document.mozCancelFullScreen) return document.mozCancelFullScreen();
            if (document.msExitFullscreen) return document.msExitFullscreen();
        }

        fsBtn.addEventListener('click', async () => {
            try {
                if (!isFullscreen()) {
                    await requestFull(wrapper);
                    fsBtn.textContent = 'Exit fullscreen';
                } else {
                    await exitFull();
                    fsBtn.textContent = 'Enter fullscreen';
                }
            } catch (e) {
                console.error('Fullscreen request failed', e);
            }
        });

        homeBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // Keep button text in sync if user exits with Esc
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
            .forEach(evt => {
                document.addEventListener(evt, () => {
                    fsBtn.textContent = isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen';
                });
            });
    </script>
</body>
</html>
